services:
  # ─── Backend (Node.js API) ────────────────────────────────────────────
  - type: web
    name: bikasafe-backend
    env: node
    plan: free
    rootDir: backend
    # patch-schema.js switches Prisma provider: sqlite → postgresql before build
    # db push applies the current schema to the Render PostgreSQL DB (no migration history needed)
    buildCommand: npm install && node scripts/patch-schema.js && npm run build && npx prisma db push --accept-data-loss
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bikasafe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://bikasafe-frontend.onrender.com
      # ── Email (SMTP) — set these manually on Render dashboard ─────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # ── Africa's Talking (SMS) — set these manually on Render dashboard
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        value: BIKASAFE

  # ─── Frontend (Vite SPA) ──────────────────────────────────────────────
  - type: web
    name: bikasafe-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback — React Router handles all client-side paths
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://bikasafe-backend.onrender.com

# ─── PostgreSQL Database ─────────────────────────────────────────────────
databases:
  - name: bikasafe-db
    plan: free
    databaseName: bikasafe
    user: bikasafe
