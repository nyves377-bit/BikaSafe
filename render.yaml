services:
  # Backend Service
  - type: web
    name: bikasafe-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && node scripts/patch-schema.js && npm run build && npx prisma db push
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bikasafe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://bikasafe-frontend.onrender.com

  # Frontend Service
  - type: web
    name: bikasafe-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://bikasafe-backend.onrender.com

databases:
  - name: bikasafe-db
    plan: free
